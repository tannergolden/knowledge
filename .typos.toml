# --- Vault Spell-Check Words ---
#
# Words the shared standards config does not know but this vault spells
# correctly. `typos` finds this file on its own and adds it to the shared
# config that the Check Spelling job passes with --config, so both lists apply.
#
# Additive, like the shared list: add the term rather than reword the sentence.
#
# ---

[default.extend-words]
Extraversion = "Extraversion" # the Big Five domain, Profile/Personality.md

# A file waiting at the Inbox is spelt as it arrived: it is sorted, never
# corrected (Inbox/README.md). The Inbox's own README.md and the folders it
# keeps are checked like any other note, so what is left out is exactly what
# .github/scripts/vault.py calls a drop, as in .gitattributes. A `!` line puts
# a path back.
[files]
extend-exclude = [
  "/Inbox/*",
  "!/Inbox/README.md",
  "!/Inbox/Backups/",
  "!/Inbox/Ideas/",
  "!/Inbox/Reports/",
  "!/Inbox/Research/",
  "!/Inbox/Visuals/",
]
